# Pages CMS — Physical Computing 2026 — Matti-only test
# Place this file at the repository root as .pages.yml.
# Only Matti’s content and image collection are exposed in this test configuration.
# All invited collaborators share access to these configured entries.
# Pages use content/2026/<person>/<title-slug>/index.md.
# New images use assets/images/2026/<person>/ with random filenames to avoid collisions.
# Existing page-bundle images and content are not moved.
# Background image is a filename field because the site's custom template only
# resolves bgimage from page resources. Featured/inline uploads use global assets.
# Author names inferred from folder names can be corrected in each default list.
# Preserve extra frontmatter keys (e.g. bgImage on existing pages) with merge: true.

media:
- name: images-matti-niinimaki
  label: Matti Niinimäki — images
  input: assets/images/2026/matti-niinimaki
  output: /images/2026/matti-niinimaki
  categories:
  - image
  rename: random