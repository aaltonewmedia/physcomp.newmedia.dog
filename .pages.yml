# Pages CMS — Physical Computing 2026
# Place at the repository root as .pages.yml.
# All invited collaborators share access to all configured content.
# Pages: content/2026/<person>/<title-slug>/index.md.
# Images: assets/images/2026/<person>/; output /images/2026/<person>/.
# Existing page-bundle images are not moved.
# bgimage accepts an existing page-bundle filename (the current theme's behavior).
# heroStyle and draft are hidden, readonly fields with defaults for new pages.
# Preserve additional frontmatter keys with settings.content.merge.

